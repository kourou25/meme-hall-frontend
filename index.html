  <meta name="theme-color" content="#F7F6F0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14261F" media="(prefers-color-scheme: dark)" />
  <script>
    (function () {
      var t = localStorage.getItem('theme')
      if (t !== 'light' && t !== 'dark') t = 'system'
      document.documentElement.dataset.themeMode = t
      document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = document.documentElement.dataset.theme === 'dark' ? '#14261F' : '#F7F6F0' })
      // 伪装：首屏就换好标题和图标，别闪出原样
      var skin = localStorage.getItem('skin')
      var cover = { feishu: ['飞书', '/disguise/feishu.svg'], linuxdo: ['【持续更新】每天摸鱼时收集的图，欢迎佬友补充 - 搞七捻三 - LINUX DO', '/disguise/linuxdo.svg'] }[skin]
      if (cover) {
        document.documentElement.dataset.skin = skin
        document.title = cover[0]
        document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]').forEach(function (l) {
          l.dataset.origHref = l.getAttribute('href')
          l.dataset.origType = l.getAttribute('type') || ''
          l.setAttribute('href', cover[1])
          l.setAttribute('type', 'image/svg+xml')
        })
      }
      try {
        var lk = JSON.parse(localStorage.getItem('look') || '{}')
        if (lk.kind === 'preset' && lk.id) document.documentElement.dataset.bg = lk.id
      } catch (e) {}
    })()
  </script>
